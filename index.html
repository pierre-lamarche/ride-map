<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ride Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #app {
      display: flex;
      height: 100%;
    }
    #panel {
      width: 340px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
    }
    #panel header {
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
    }
    #panel header h1 {
      font-size: 16px;
      margin: 0 0 2px;
    }
    #status {
      font-size: 12px;
      color: #666;
    }
    #filters {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #filters .range {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #444;
    }
    #filters input[type="date"] {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    #filters .actions {
      display: flex;
      gap: 8px;
    }
    #filters button {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f7f9fc;
      cursor: pointer;
      font-size: 12px;
    }
    #filters button:hover:not(:disabled) {
      background: #eef4ff;
    }
    #filters button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #overlayBtn {
      background: #2b6cb0;
      color: #0f2a4a;
      border-color: #2b6cb0;
    }
    #overlayBtn:hover:not(:disabled) {
      background: #245a94;
    }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }
    #list li {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      border-left: 3px solid transparent;
      cursor: pointer;
    }
    #list li:hover {
      background: #f5f9ff;
    }
    #list li.active {
      background: #e8f1ff;
    }
    #legend {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 12px;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: #444;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    #legend-bar {
      height: 8px;
      width: 200px;
      border-radius: 4px;
    }
    #legend .labels {
      display: flex;
      justify-content: space-between;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .nom {
      font-weight: 600;
      font-size: 13px;
    }
    .date {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }
    .meta {
      font-size: 12px;
      color: #444;
      margin-top: 4px;
      display: flex;
      gap: 10px;
    }
    .badge {
      background: #eef;
      border-radius: 4px;
      padding: 1px 6px;
    }
    #map {
      flex: 1;
      height: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <header>
        <h1>Parcours</h1>
        <div id="status">Chargement de DuckDB…</div>
      </header>
      <div id="filters">
        <div class="range">
          <label for="from">Du</label>
          <input type="date" id="from" />
          <label for="to">au</label>
          <input type="date" id="to" />
        </div>
        <div class="actions">
          <button id="overlayBtn">Superposer tout</button>
          <button id="clearBtn">Tout effacer</button>
        </div>
      </div>
      <ul id="list"></ul>
    </div>
    <div id="map">
      <div id="legend">
        <div id="legend-bar"></div>
        <div class="labels">
          <span id="legend-from"></span>
          <span id="legend-to"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
    { "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17/+esm" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
